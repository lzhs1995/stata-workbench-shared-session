name: Public Release Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run check
      - run: python -B -m unittest discover -s tools -p 'test_*.py'
      - run: python -B tools/verify_release.py
      - run: npm run package
      - run: python -B tools/verify_release.py --vsix stata-workbench-shared-session-0.1.3-rc.7.39.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: public-candidate-vsix
          path: '*.vsix'
